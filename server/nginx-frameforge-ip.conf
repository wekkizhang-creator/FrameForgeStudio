server {
    listen 80;
    listen [::]:80;
    server_name 163.7.4.158;

    root /var/www/frameforge/current;
    index studio.html index.html;

    client_max_body_size 512m;

    access_log /var/log/nginx/frameforge_access.log;
    error_log /var/log/nginx/frameforge_error.log;

    location = / {
        try_files /studio.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4174/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering on;
    }

    location /_next/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /studio.html;
    }
}
